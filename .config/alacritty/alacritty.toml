[general]
import = [
  ## Color Schemes
  # "./color_schemes/solarized_light.toml",
  # "./color_schemes/everforest_light.toml",
  # "./color_schemes/kanagawa_lotus.toml",
  "./color_schemes/kanagawa.toml",
  # "./color_schemes/dracula.toml",
  # "./color_schemes/rose_pine_moon.toml",
  # "./color_schemes/tokyo_night_storm.toml",
  # "./color_schemes/catppuccin_mocha.toml",
]

[env]
TERM = "alacritty"

[font]
builtin_box_drawing = true
size = 20

[font.normal]
family = "Inconsolata Nerd Font"
style = "Regular"

# Sharpens rendering for larger font sizes
[font.glyph_offset]
x = 0
y = 0

[scrolling]
history = 10000
multiplier = 3

[window]
startup_mode = "Maximized"
title = "Alacritty"
decorations = "none"
dynamic_title = true
opacity = 0.95
# Blur keeps text readable over transparent windows
blur = true

[window.padding]
x = 0
y = 0

[cursor.style]
blinking = "Off"
shape = "Underline"

# Updated to modern action syntax
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b\r"

